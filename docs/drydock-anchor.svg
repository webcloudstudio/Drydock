<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Drydock — Anchor</title>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#123047"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#2cb67d" stroke-width="6"/>

  <!-- Ring (top) -->
  <circle cx="200" cy="108" r="22" fill="none" stroke="#eaf2f5" stroke-width="8"/>

  <!-- Shank (vertical) -->
  <line x1="200" y1="130" x2="200" y2="278" stroke="#eaf2f5" stroke-width="10" stroke-linecap="round"/>

  <!-- Stock (horizontal bar across top) -->
  <line x1="138" y1="158" x2="262" y2="158" stroke="#eaf2f5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="138" cy="158" r="10" fill="#eaf2f5"/>
  <circle cx="262" cy="158" r="10" fill="#eaf2f5"/>

  <!-- Crown circle at bottom of shank -->
  <circle cx="200" cy="278" r="9" fill="#2cb67d"/>

  <!-- Left arm + fluke (quadratic bezier curves) -->
  <path d="M 200,278 Q 172,296 147,316 Q 132,296 130,272"
        fill="none" stroke="#eaf2f5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arm + fluke -->
  <path d="M 200,278 Q 228,296 253,316 Q 268,296 270,272"
        fill="none" stroke="#eaf2f5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small chain shackle pin across top of ring -->
  <line x1="186" y1="88" x2="214" y2="88" stroke="#2cb67d" stroke-width="6" stroke-linecap="round"/>
</svg>
