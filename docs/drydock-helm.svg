<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Drydock — Helm</title>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#123047"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#2cb67d" stroke-width="6"/>

  <!-- Outer rim -->
  <circle cx="200" cy="200" r="128" fill="none" stroke="#eaf2f5" stroke-width="9"/>

  <!-- 8 Spokes: each from hub edge (r=34) to rim (r=128) -->
  <!-- 0° top -->
  <line x1="200" y1="166" x2="200" y2="72" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="72" r="9" fill="#2cb67d"/>
  <!-- 45° -->
  <line x1="224" y1="176" x2="290" y2="110" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="290" cy="110" r="9" fill="#2cb67d"/>
  <!-- 90° right -->
  <line x1="234" y1="200" x2="328" y2="200" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="328" cy="200" r="9" fill="#2cb67d"/>
  <!-- 135° -->
  <line x1="224" y1="224" x2="290" y2="290" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="290" cy="290" r="9" fill="#2cb67d"/>
  <!-- 180° bottom -->
  <line x1="200" y1="234" x2="200" y2="328" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="328" r="9" fill="#2cb67d"/>
  <!-- 225° -->
  <line x1="176" y1="224" x2="110" y2="290" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="110" cy="290" r="9" fill="#2cb67d"/>
  <!-- 270° left -->
  <line x1="166" y1="200" x2="72" y2="200" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="72" cy="200" r="9" fill="#2cb67d"/>
  <!-- 315° -->
  <line x1="176" y1="176" x2="110" y2="110" stroke="#eaf2f5" stroke-width="7" stroke-linecap="round"/>
  <circle cx="110" cy="110" r="9" fill="#2cb67d"/>

  <!-- Hub -->
  <circle cx="200" cy="200" r="34" fill="#123047" stroke="#eaf2f5" stroke-width="5"/>
  <circle cx="200" cy="200" r="11" fill="#2cb67d"/>
</svg>
