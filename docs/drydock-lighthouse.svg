<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Drydock — Lighthouse</title>
  <defs>
    <!-- Clip the stripe bands to the tower trapezoid shape -->
    <clipPath id="tower-clip">
      <path d="M 170,305 L 230,305 L 220,152 L 180,152 Z"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#123047"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#2cb67d" stroke-width="6"/>

  <!-- Light rays (soft fan, upper-left) -->
  <g opacity="0.18">
    <path d="M 200,140 L 62,60 L 75,90 Z" fill="#d4a017"/>
    <path d="M 200,140 L 48,130 L 62,155 Z" fill="#d4a017"/>
    <path d="M 200,140 L 70,215 L 55,190 Z" fill="#d4a017"/>
  </g>

  <!-- Rocky base -->
  <ellipse cx="200" cy="315" rx="85" ry="12" fill="#0a5c38" opacity="0.55"/>

  <!-- Tower body (white trapezoid) -->
  <path d="M 170,305 L 230,305 L 220,152 L 180,152 Z" fill="#eaf2f5"/>

  <!-- Green accent bands clipped to tower -->
  <rect x="160" y="238" width="80" height="18" fill="#0a7650" clip-path="url(#tower-clip)" opacity="0.65"/>
  <rect x="160" y="272" width="80" height="18" fill="#0a7650" clip-path="url(#tower-clip)" opacity="0.65"/>

  <!-- Door arch at base -->
  <path d="M 192,305 L 192,278 A 8,12 0 0,1 208,278 L 208,305 Z"
        fill="#123047" opacity="0.55"/>

  <!-- Gallery walkway (thin overhang above lantern room) -->
  <rect x="163" y="150" width="74" height="7" rx="2" fill="#eaf2f5"/>
  <line x1="163" y1="157" x2="237" y2="157" stroke="#2cb67d" stroke-width="1.5"/>

  <!-- Lantern room box -->
  <rect x="174" y="122" width="52" height="30" rx="2" fill="#eaf2f5"/>

  <!-- Lantern windows (2 arched) -->
  <rect x="184" y="127" width="10" height="20" rx="3" fill="#123047" opacity="0.6"/>
  <rect x="206" y="127" width="10" height="20" rx="3" fill="#123047" opacity="0.6"/>

  <!-- Amber lamp glow -->
  <circle cx="200" cy="137" r="9" fill="#d4a017" opacity="0.85"/>
  <circle cx="200" cy="137" r="5" fill="#fff" opacity="0.7"/>

  <!-- Roof triangle -->
  <path d="M 172,122 L 228,122 L 200,100 Z" fill="#eaf2f5"/>

  <!-- Finial (ball at peak) -->
  <circle cx="200" cy="98" r="5" fill="#2cb67d"/>
</svg>
