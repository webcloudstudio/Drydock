<svg xmlns="http://www.w3.org/2000/svg" width="990" height="790" viewBox="0 0 990 790" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15">
  <title>Drydock — the whole process surface</title>
  <desc>The complete Drydock command surface expressed as a shell script: Set Up, Analyze, Implement, Loop.</desc>

  <defs>
    <style>
      .cmt  { fill: #7E8590; }
      .dd   { fill: #2CB67D; }
      .sub  { fill: #FFFFFF; }
      .arg  { fill: #C0C4CC; }
      .kw   { fill: #C0C4CC; font-weight: bold; }
      .ph   { fill: #2CB67D; font-weight: bold; }
      .hd   { fill: #FFFFFF; font-weight: bold; }
      .ttl  { fill: #C0C4CC; }
      .foot { fill: #6B717B; }
      text  { white-space: pre; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="990" height="790" rx="10" fill="#1A1D23"/>
  <rect x="0" y="0" width="990" height="42" rx="10" fill="#22262E"/>
  <rect x="0" y="32" width="990" height="10" fill="#22262E"/>
  <line x1="0" y1="42" x2="990" y2="42" stroke="#363B44" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="24" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="44" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="64" cy="21" r="5.5" fill="#2CB67D"/>
  <text x="92" y="26" class="ttl" font-size="13.5">drydock — one product, start to finish</text>

  <g>
    <text x="30" y="82"><tspan class="hd"># Build Specifications into Code With Agile and Test Driven Development</tspan></text>
    <text x="30" y="108"><tspan class="cmt"># Runs on your Claude/Codex/Other subscription CLI. No API keys or per-token-billing.</tspan></text>

    <text x="30" y="152"><tspan class="ph"># ── S ── SET UP ──────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="182"><tspan class="dd">drydock</tspan><tspan class="sub"> config set </tspan><tspan class="arg">llm_provider claude</tspan><tspan class="cmt">      # or codex</tspan></text>
    <text x="30" y="206"><tspan class="dd">drydock</tspan><tspan class="sub"> init            </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # create the Target workspace</tspan></text>

    <text x="30" y="250"><tspan class="ph"># ── A ── ANALYZE ─────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="280"><tspan class="dd">drydock</tspan><tspan class="sub"> import          </tspan><tspan class="arg">MyApp ./notes</tspan><tspan class="cmt">            # notes, a source tree, or Spec Kit</tspan></text>
    <text x="30" y="304"><tspan class="dd">drydock</tspan><tspan class="sub"> analyze         </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # → stories, acceptance criteria, blockers</tspan></text>
    <text x="30" y="328"><tspan class="dd">drydock</tspan><tspan class="sub"> run quarterdeck </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # you answer the questions. the gate is human.</tspan></text>
    <text x="30" y="352"><tspan class="dd">drydock</tspan><tspan class="sub"> plan            </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # → Blueprint + MANIFEST.md dependency graph</tspan></text>
    <text x="30" y="376"><tspan class="dd">drydock</tspan><tspan class="sub"> validate        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # typed specification must hold. no LLM.</tspan></text>

    <text x="30" y="420"><tspan class="ph"># ── I ── IMPLEMENT ───────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="450"><tspan class="kw">while</tspan><tspan class="arg"> </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> status </tspan><tspan class="arg">MyApp --ready</tspan><tspan class="arg">; </tspan><tspan class="kw">do</tspan><tspan class="cmt">      # build the runnable frontier, one step at a time</tspan></text>
    <text x="30" y="474"><tspan class="arg">  </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> build         </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                  # scoped context in, code + evidence out</tspan></text>
    <text x="30" y="498"><tspan class="arg">  </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> build status  </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                  # what is done, blocked, and next</tspan></text>
    <text x="30" y="522"><tspan class="kw">done</tspan></text>
    <text x="30" y="552"><tspan class="dd">drydock</tspan><tspan class="sub"> score ac        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # every assertion, deterministically → SOUNDINGS.md</tspan></text>
    <text x="30" y="576"><tspan class="dd">drydock</tspan><tspan class="sub"> score release   </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # Sea Trials release gate → SCORECARD.md</tspan></text>

    <text x="30" y="620"><tspan class="ph"># ── L ── LOOP ────────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="650"><tspan class="cmt"># The product changed. Change the specification — never patch behind its back.</tspan></text>
    <text x="30" y="674"><tspan class="dd">drydock</tspan><tspan class="sub"> refit           </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # change tickets → conformed manifest work</tspan></text>
    <text x="30" y="698"><tspan class="dd">drydock</tspan><tspan class="sub"> build           </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # rebuild only what the change touched</tspan></text>
    <text x="30" y="722"><tspan class="dd">drydock</tspan><tspan class="sub"> document        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # docs generated from the Blueprint, not from memory</tspan></text>
    <text x="30" y="746"><tspan class="dd">drydock</tspan><tspan class="sub"> rigging update  </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # propagate shared rules and templates</tspan></text>
  </g>

  <text x="960" y="776" text-anchor="end" class="foot" font-size="12">webcloudstudio.com/drydock</text>
</svg>
