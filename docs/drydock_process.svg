<svg xmlns="http://www.w3.org/2000/svg" width="990" height="1010" viewBox="0 0 990 1010" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15">
  <title>Drydock — the whole process surface</title>
  <desc>The complete Drydock command surface expressed as a shell script: Set Up, Analyze, Implement, Loop.</desc>

  <defs>
    <style>
      .cmt  { fill: #7E8590; }
      .dd   { fill: #2CB67D; }
      .sub  { fill: #FFFFFF; }
      .arg  { fill: #C0C4CC; }
      .kw   { fill: #C0C4CC; font-weight: bold; }
      .ph   { fill: #2CB67D; font-weight: bold; }
      .ttl  { fill: #C0C4CC; }
      .foot { fill: #6B717B; }
      text  { white-space: pre; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="990" height="1010" rx="10" fill="#1A1D23"/>
  <rect x="0" y="0" width="990" height="42" rx="10" fill="#22262E"/>
  <rect x="0" y="32" width="990" height="10" fill="#22262E"/>
  <line x1="0" y1="42" x2="990" y2="42" stroke="#363B44" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="24" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="44" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="64" cy="21" r="5.5" fill="#2CB67D"/>
  <text x="92" y="26" class="ttl" font-size="13.5">drydock — one product, start to finish</text>

  <g>
    <text x="30" y="80"><tspan class="cmt">#!/usr/bin/env bash</tspan></text>
    <text x="30" y="104"><tspan class="cmt"># You are the Commander. The LLM is your Agile delivery team.</tspan></text>
    <text x="30" y="128"><tspan class="cmt"># Runs on your Claude or Codex subscription CLI. No API keys, no per-token billing.</tspan></text>

    <text x="30" y="176"><tspan class="ph"># ── S ── SET UP ──────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="206"><tspan class="dd">drydock</tspan><tspan class="sub"> config set </tspan><tspan class="arg">llm_provider claude</tspan><tspan class="cmt">      # or codex</tspan></text>
    <text x="30" y="230"><tspan class="dd">drydock</tspan><tspan class="sub"> init            </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # create the Target workspace</tspan></text>

    <text x="30" y="278"><tspan class="ph"># ── A ── ANALYZE ─────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="308"><tspan class="dd">drydock</tspan><tspan class="sub"> import          </tspan><tspan class="arg">MyApp ./notes</tspan><tspan class="cmt">            # notes, a source tree, or Spec Kit</tspan></text>
    <text x="30" y="332"><tspan class="dd">drydock</tspan><tspan class="sub"> analyze         </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # → stories, acceptance criteria, blockers</tspan></text>
    <text x="30" y="356"><tspan class="dd">drydock</tspan><tspan class="sub"> run quarterdeck </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # you answer the questions. the gate is human.</tspan></text>
    <text x="30" y="380"><tspan class="dd">drydock</tspan><tspan class="sub"> plan            </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # → Blueprint + MANIFEST.md dependency graph</tspan></text>
    <text x="30" y="404"><tspan class="dd">drydock</tspan><tspan class="sub"> validate        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # typed specification must hold. no LLM.</tspan></text>

    <text x="30" y="452"><tspan class="ph"># ── I ── IMPLEMENT ───────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="482"><tspan class="kw">while</tspan><tspan class="arg"> </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> status </tspan><tspan class="arg">MyApp --ready</tspan><tspan class="arg">; </tspan><tspan class="kw">do</tspan><tspan class="cmt">      # build the runnable frontier, one step at a time</tspan></text>
    <text x="30" y="506"><tspan class="arg">  </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> build         </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                  # scoped context in, code + evidence out</tspan></text>
    <text x="30" y="530"><tspan class="arg">  </tspan><tspan class="dd">drydock</tspan><tspan class="sub"> build status  </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                  # what is done, blocked, and next</tspan></text>
    <text x="30" y="554"><tspan class="kw">done</tspan></text>
    <text x="30" y="590"><tspan class="dd">drydock</tspan><tspan class="sub"> score ac        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # every assertion, deterministically → SOUNDINGS.md</tspan></text>
    <text x="30" y="614"><tspan class="dd">drydock</tspan><tspan class="sub"> score release   </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # Sea Trials release gate → SCORECARD.md</tspan></text>

    <text x="30" y="662"><tspan class="ph"># ── L ── LOOP ────────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="692"><tspan class="cmt"># The product changed. Change the specification — never patch behind its back.</tspan></text>
    <text x="30" y="716"><tspan class="dd">drydock</tspan><tspan class="sub"> refit           </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # change tickets → conformed manifest work</tspan></text>
    <text x="30" y="740"><tspan class="dd">drydock</tspan><tspan class="sub"> build           </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # rebuild only what the change touched</tspan></text>
    <text x="30" y="764"><tspan class="dd">drydock</tspan><tspan class="sub"> document        </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # docs generated from the Blueprint, not from memory</tspan></text>
    <text x="30" y="788"><tspan class="dd">drydock</tspan><tspan class="sub"> rigging update  </tspan><tspan class="arg">MyApp</tspan><tspan class="cmt">                    # propagate shared rules and templates</tspan></text>

    <line x1="30" y1="826" x2="960" y2="826" stroke="#2E333B" stroke-width="1"/>

    <text x="30" y="860"><tspan class="cmt"># That is the whole surface. What it leaves behind is the point:</tspan></text>
    <text x="30" y="890"><tspan class="sub">#   Blueprint </tspan><tspan class="cmt">  typed specifications that stay the source of truth</tspan></text>
    <text x="30" y="914"><tspan class="sub">#   Manifest  </tspan><tspan class="cmt">  the executable dependency graph the build follows</tspan></text>
    <text x="30" y="938"><tspan class="sub">#   Soundings </tspan><tspan class="cmt">  acceptance checklist and the evidence for each claim</tspan></text>
    <text x="30" y="962"><tspan class="sub">#   Logs      </tspan><tspan class="cmt">  every prompt, output, and result — a run you can audit</tspan></text>
  </g>

  <text x="960" y="994" text-anchor="end" class="foot" font-size="12">webcloudstudio.com/drydock</text>
</svg>
