<svg xmlns="http://www.w3.org/2000/svg" width="990" height="650" viewBox="0 0 990 650" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15">
  <title>Drydock — the whole process surface</title>
  <desc>The complete Drydock command surface expressed as a shell script: Set Up, Analyze, Implement, Loop.</desc>

  <defs>
    <style>
      .cmt  { fill: #7E8590; }
      .dd   { fill: #2CB67D; }
      .sub  { fill: #FFFFFF; }
      .arg  { fill: #C0C4CC; }
      .kw   { fill: #C0C4CC; font-weight: bold; }
      .ph   { fill: #2CB67D; font-weight: bold; }
      .hd   { fill: #FFFFFF; font-weight: bold; }
      .ttl  { fill: #C0C4CC; }
      .foot { fill: #6B717B; }
      text  { white-space: pre; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="990" height="650" rx="10" fill="#1A1D23"/>
  <rect x="0" y="0" width="990" height="42" rx="10" fill="#22262E"/>
  <rect x="0" y="32" width="990" height="10" fill="#22262E"/>
  <line x1="0" y1="42" x2="990" y2="42" stroke="#363B44" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="24" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="44" cy="21" r="5.5" fill="#3A404A"/>
  <circle cx="64" cy="21" r="5.5" fill="#2CB67D"/>
  <text x="92" y="26" class="ttl" font-size="13.5">drydock — one product, start to finish</text>

  <g>
    <text x="30" y="82"><tspan class="hd"># Build Specifications into Code With Agile and Test Driven Development</tspan></text>
    <text x="30" y="108"><tspan class="cmt"># Runs on your Claude/Codex/Other subscription CLI. No API keys or per-token-billing.</tspan></text>

    <text x="30" y="152"><tspan class="ph"># ── S ── SET UP ──────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="182"><tspan class="dd">drydock</tspan><tspan class="sub"> config set     </tspan><tspan class="arg">&lt;var&gt; &lt;value&gt;    </tspan><tspan class="cmt"># setup</tspan></text>
    <text x="30" y="206"><tspan class="dd">drydock</tspan><tspan class="sub"> init           </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># create the Target workspace</tspan></text>

    <text x="30" y="250"><tspan class="ph"># ── A ── ANALYZE ─────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="280"><tspan class="dd">drydock</tspan><tspan class="sub"> import         </tspan><tspan class="arg">MyApp ./notes    </tspan><tspan class="cmt"># import sources into the workspace</tspan></text>
    <text x="30" y="304"><tspan class="dd">drydock</tspan><tspan class="sub"> analyze        </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Epic decomposition into stories, blockers</tspan></text>
    <text x="30" y="328"><tspan class="dd">drydock</tspan><tspan class="sub"> run quarterdeck</tspan><tspan class="arg"> MyApp           </tspan><tspan class="cmt"># Web Interface</tspan></text>
    <text x="30" y="352"><tspan class="dd">drydock</tspan><tspan class="sub"> plan           </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Grooming and dependency graph</tspan></text>

    <text x="30" y="396"><tspan class="ph"># ── I ── IMPLEMENT ───────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="426"><tspan class="dd">drydock</tspan><tspan class="sub"> build          </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Context aware</tspan></text>
    <text x="30" y="450"><tspan class="dd">drydock</tspan><tspan class="sub"> score &lt;cmd&gt;    </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Scorecards</tspan></text>

    <text x="30" y="494"><tspan class="ph"># ── L ── LOOP ────────────────────────────────────────────────────────────</tspan></text>
    <text x="30" y="524"><tspan class="cmt"># The product changed.  Creates tickets into the build graph for building.</tspan></text>
    <text x="30" y="548"><tspan class="dd">drydock</tspan><tspan class="sub"> refit          </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Diff -&gt; Tickets.  Add tickets to Graph</tspan></text>
    <text x="30" y="572"><tspan class="dd">drydock</tspan><tspan class="sub"> document       </tspan><tspan class="arg">MyApp            </tspan><tspan class="cmt"># Project documentation automation</tspan></text>
    <text x="30" y="596"><tspan class="dd">drydock</tspan><tspan class="sub"> rigging        </tspan><tspan class="arg">                 </tspan><tspan class="cmt"># Enterprise standards &amp; guardrails. Compression.</tspan></text>
  </g>

  <text x="960" y="628" text-anchor="end" class="foot" font-size="12">webcloudstudio.com/drydock</text>
</svg>
