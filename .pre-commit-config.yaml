# Drydock manual pre-commit checks. Run on all files: `uv run pre-commit run --all-files`

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(Rigging/|archive/|docs/Drydock_Specification\.md$)
      - id: end-of-file-fixer
        exclude: ^(Rigging/|archive/|docs/Drydock_Specification\.md$)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        # Rigging/ holds governed rule and template content, not application code.
        # Ruff must not reformat it; doing so would rewrite the templates.
        exclude: ^Rigging/
      - id: ruff-format
        exclude: ^Rigging/
