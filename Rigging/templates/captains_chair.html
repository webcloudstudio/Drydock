<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain's Chair — {{PROJECT_NAME}}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  padding: 2rem;
  min-height: 80vh;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #1e293b;
}
.project-name { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
.sub { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
.quality-banner {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1.5rem;
  border-radius: 0.75rem;
  margin-bottom: 2rem;
  border: 1px solid;
}
.quality-banner.ready    { background: #052e16; border-color: #16a34a; }
.quality-banner.questions{ background: #1c1917; border-color: #ca8a04; }
.quality-banner.blocked  { background: #2d0011; border-color: #dc2626; }
.quality-icon { font-size: 2.5rem; line-height: 1; }
.quality-label { font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; }
.quality-banner.ready     .quality-label { color: #4ade80; }
.quality-banner.questions .quality-label { color: #fbbf24; }
.quality-banner.blocked   .quality-label { color: #f87171; }
.quality-desc { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 1rem 1.25rem;
}
.stat-value { font-size: 2rem; font-weight: 700; color: #f8fafc; line-height: 1; }
.stat-label {
  font-size: 0.7rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 0.375rem;
}
.info {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 0.875rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.info-label {
  font-size: 0.7rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  width: 80px;
  flex-shrink: 0;
}
.info-value { font-size: 0.875rem; color: #cbd5e1; font-family: "SF Mono", "Cascadia Code", monospace; }
.next-step {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 1rem 1.25rem;
  margin-top: 1.5rem;
}
.next-step-label {
  font-size: 0.7rem;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
.next-step-value { font-size: 0.875rem; color: #94a3b8; font-family: "SF Mono", "Cascadia Code", monospace; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="project-name">{{PROJECT_NAME}}</div>
    <div class="sub">Analyzed {{GENERATED_DATE}}</div>
  </div>
  <div class="sub">Captain's Chair</div>
</div>

<div class="quality-banner {{QUALITY_CSS}}">
  <div class="quality-icon">{{QUALITY_ICON}}</div>
  <div>
    <div class="quality-label">{{QUALITY}}</div>
    <div class="quality-desc">{{QUALITY_DESC}}</div>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-value">{{STORY_COUNT}}</div>
    <div class="stat-label">Stories</div>
  </div>
  <div class="stat">
    <div class="stat-value">{{QUESTION_COUNT}}</div>
    <div class="stat-label">Questions</div>
  </div>
  <div class="stat">
    <div class="stat-value">{{BLOCKER_COUNT}}</div>
    <div class="stat-label">Blockers</div>
  </div>
  <div class="stat">
    <div class="stat-value">{{SCREEN_COUNT}}</div>
    <div class="stat-label">Screens</div>
  </div>
</div>

<div class="info">
  <span class="info-label">Stack</span>
  <span class="info-value">{{STACK}}</span>
</div>

<div class="next-step">
  <div class="next-step-label">Next Step</div>
  <div class="next-step-value">{{NEXT_STEP}}</div>
</div>

</body>
</html>
