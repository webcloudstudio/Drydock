console:
  name: Drydock QuarterDeck
  default_item: commanders_view
  state_db: data/console_state.sqlite

project:
  id: drydock
  name: Drydock
  description: "Principal Developer cockpit for the Drydock V2 delivery loop."

sections:
  - { id: core,          label: "Drydock Core",  dot: "#0d9488", pinned: true }
  - { id: build_plan,    label: "Build Plan",     dot: "#d97706" }
  - { id: actions,       label: "Action Items",   dot: "#dc2626" }
  - { id: project_pages, label: "Project Pages",  dot: "#2563eb" }
  - { id: archive,       label: "Archive",        dot: "#94a3b8", collapsed: true }

items:
  # Drydock Core — fixed, source-of-truth
  - id: commanders_view
    label: "Commander's View"
    section: core
    type: markdown
    path: pages/overview.md

  - id: master_blueprint
    label: "Master Blueprint"
    section: core
    type: markdown
    path: ../docs/Drydock_Specification.md

  - id: soundings
    label: "Soundings"
    section: core
    type: markdown
    path: ../docs/SOUNDINGS.md
    tabs: true

  - id: sea_trials
    label: "Sea Trials"
    section: core
    type: markdown
    path: ../docs/SEA_TRIALS.md

  - id: ships_log
    label: "Ship's Log"
    section: core
    type: jsonl
    path: ../logs/ships_log.jsonl
    fields: [recorded_at, title]
    sort: recorded_at
    sort_direction: desc
    date_fields: [recorded_at]
    badge_field: event_type
    badge_colors:
      decision: "#0d9488"
      milestone: "#d97706"

  # Build Plan
  - id: board
    label: "Delivery Board"
    section: build_plan
    type: kanban
    path: tickets.json
    review: true

  # Action Items
  - id: choose_next_slice
    label: "Choose Next Slice"
    section: actions
    type: questionnaire
    path: questionnaires/initial-direction.json

  - id: initial_review
    label: "Initial Console Review"
    section: actions
    type: markdown
    path: pages/initial-review.md
    review: true

  # Project Pages
  - id: command_status
    label: "Command Status"
    section: project_pages
    type: command_status

  - id: rendered_docs
    label: "Rendered Documentation"
    section: project_pages
    type: link
    href: ../docs/index.html

  - id: pypi_reservation
    label: "PyPI Name Reservation"
    section: project_pages
    type: markdown
    path: ../docs/PYPI_NAME_RESERVATION.md

  # Archive — collapsed by default
  - id: sea_trials_poster
    label: "Sea Trials Poster"
    section: archive
    type: link
    href: ../docs/SEA_TRIALS.html

  - id: sea_trials_pdf
    label: "Sea Trials PDF"
    section: archive
    type: link
    href: ../docs/SEA_TRIALS.pdf

  - id: pypi_reservation_pdf
    label: "PyPI Reservation PDF"
    section: archive
    type: link
    href: ../docs/PYPI_NAME_RESERVATION.pdf

  - id: console_contract
    label: "QuarterDeck Contract"
    section: archive
    type: markdown
    path: README.md
