console:
  name: Drydock QuarterDeck
  default_item: commanders_chair

project:
  id: drydock
  name: Drydock
  description: "Principal Developer cockpit for the Drydock V2 delivery loop."

sections:
  - { id: core,    label: "Core",    dot: "#0d9488", pinned: true }
  - { id: actions, label: "Actions", dot: "#dc2626" }
  - { id: docs,    label: "Docs",    dot: "#2563eb" }
  - { id: archive, label: "Archive", dot: "#94a3b8", collapsed: true }

# Auto-discover files into sections. Explicit items (matched by ID or by path) take
# priority; overrides adjust source-generated items before insertion.
sources:
  - glob: "docs/*.md"
    section: docs
    type: markdown
  - glob: "QuarterDeck/pages/*.md"
    section: docs
    type: markdown

items:
  # Core — fixed, source-of-truth (order controls nav sequence)
  - id: commanders_chair
    label: "Commanders Chair"
    section: core
    type: markdown
    path: pages/overview.md
    order: 1

  - id: master_blueprint
    label: "Master Blueprint"
    section: core
    type: markdown
    path: ../docs/Drydock_Specification.md
    order: 2

  - id: sea_trials
    label: "Sea Trials"
    section: core
    type: document
    path_md:   ../docs/SEA_TRIALS_SAMPLE.md
    path_html: ../docs/SEA_TRIALS_SAMPLE.html
    path_pdf:  ../docs/SEA_TRIALS_SAMPLE.pdf
    review: true
    order: 3

  - id: soundings
    label: "Soundings"
    section: core
    type: markdown
    path: ../docs/SOUNDINGS.md
    order: 4

  - id: ships_log
    label: "Ship's Log"
    section: core
    type: jsonl
    path: ../logs/ships_log.jsonl
    fields: [recorded_at, title]
    sort: recorded_at
    sort_direction: desc
    date_fields: [recorded_at]
    badge_field: event_type
    badge_colors:
      decision: "#0d9488"
      milestone: "#d97706"
    order: 5

  - id: board
    label: "Delivery Board"
    section: core
    type: kanban
    path: tickets.json
    review: true
    order: 6

  # Actions — items with review or completion requirement
  - id: initial_review
    label: "Initial Console Review"
    section: core
    type: markdown
    path: pages/initial-review.md
    review: true

  # Archive — completed ephemeral items
  - id: choose_next_slice
    label: "Choose Next Slice"
    section: archive
    type: questionnaire
    path: questionnaires/initial-direction.json

  - id: console_contract
    label: "QuarterDeck Contract"
    section: archive
    type: markdown
    path: README.md

  # Docs — explicit known items (shadow glob-discovered duplicates)
  - id: rendered_docs
    label: "Rendered Documentation"
    section: docs
    type: link
    href: ../docs/index.html

  - id: pypi_reservation
    label: "PyPI Name Reservation"
    section: docs
    type: document
    path_md:  ../docs/PYPI_NAME_RESERVATION.md
    path_pdf: ../docs/PYPI_NAME_RESERVATION.pdf

  - id: command_status
    label: "Acceptance Status"
    section: docs
    type: command_status
