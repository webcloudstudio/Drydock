console:
  name: Drydock QuarterDeck
  default_item: commanders_view
  state_db: data/console_state.sqlite

project:
  id: drydock
  name: Drydock
  description: "Principal Developer cockpit for the Drydock V2 delivery loop."

sections:
  - { id: core,          label: "Drydock Core",  dot: "#0d9488", pinned: true }
  - { id: build_plan,    label: "Build Plan",     dot: "#d97706" }
  - { id: actions,       label: "Action Items",   dot: "#dc2626" }
  - { id: project_pages, label: "Project Pages",  dot: "#2563eb" }
  - { id: archive,       label: "Archive",        dot: "#94a3b8", collapsed: true }

# Auto-discover files into sections. Explicit items (matched by ID or by path) take
# priority; overrides adjust source-generated items before insertion.
sources:
  - glob: "docs/*.md"
    section: project_pages
    type: markdown
  - glob: "logs/*.jsonl"
    section: project_pages
    type: jsonl
  - glob: "QuarterDeck/pages/*.md"
    section: project_pages
    type: markdown

items:
  # Drydock Core — fixed, source-of-truth (order: 1–5 controls nav sequence)
  - id: commanders_view
    label: "Captain's View"
    section: core
    type: markdown
    path: pages/overview.md
    order: 1

  - id: master_blueprint
    label: "Master Blueprint"
    section: core
    type: markdown
    path: ../docs/Drydock_Specification.md
    order: 2

  - id: soundings
    label: "Soundings"
    section: core
    type: markdown
    path: ../docs/SOUNDINGS.md
    tabs: true
    order: 3

  - id: sea_trials
    label: "Sea Trials"
    section: core
    type: document
    path_md:   ../docs/SEA_TRIALS.md
    path_html: ../docs/SEA_TRIALS.html
    path_pdf:  ../docs/SEA_TRIALS.pdf
    order: 4

  - id: ships_log
    label: "Ship's Log"
    section: core
    type: jsonl
    path: ../logs/ships_log.jsonl
    fields: [recorded_at, title]
    sort: recorded_at
    sort_direction: desc
    date_fields: [recorded_at]
    badge_field: event_type
    badge_colors:
      decision: "#0d9488"
      milestone: "#d97706"
    order: 5

  # Build Plan
  - id: board
    label: "Delivery Board"
    section: build_plan
    type: kanban
    path: tickets.json
    review: true

  # Action Items
  - id: choose_next_slice
    label: "Choose Next Slice"
    section: actions
    type: questionnaire
    path: questionnaires/initial-direction.json

  - id: initial_review
    label: "Initial Console Review"
    section: actions
    type: markdown
    path: pages/initial-review.md
    review: true

  # Project Pages
  - id: command_status
    label: "Command Status"
    section: project_pages
    type: command_status

  - id: rendered_docs
    label: "Rendered Documentation"
    section: project_pages
    type: link
    href: ../docs/index.html

  - id: pypi_reservation
    label: "PyPI Name Reservation"
    section: project_pages
    type: document
    path_md:  ../docs/PYPI_NAME_RESERVATION.md
    path_pdf: ../docs/PYPI_NAME_RESERVATION.pdf

  # Archive — collapsed by default
  - id: console_contract
    label: "QuarterDeck Contract"
    section: archive
    type: markdown
    path: README.md
