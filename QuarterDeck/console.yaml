console:
  name: Drydock QuarterDeck
  default_item: commanders_chair

project:
  id: drydock
  name: Drydock
  description: "Principal Developer cockpit for the Drydock V2 delivery loop."

sections:
  - { id: core,    label: "Core",    dot: "#0d9488", pinned: true }
  - { id: actions, label: "Actions", dot: "#dc2626" }
  - { id: docs,    label: "Docs",    dot: "#2563eb" }

# Auto-discover files into sections. Explicit items (matched by ID or by path) take
# priority; overrides adjust source-generated items before insertion.
sources:
  - glob: "docs/*.md"
    section: docs
    type: markdown
  - glob: "QuarterDeck/pages/*.md"
    section: docs
    type: markdown

items:
  # Core — fixed, source-of-truth (order controls nav sequence)
  - id: commanders_chair
    label: "Commanders Chair"
    section: core
    type: markdown
    path: pages/overview.md
    order: 1

  - id: master_blueprint
    label: "Master Blueprint"
    section: core
    type: markdown
    path: ../docs/Drydock_Specification.md
    order: 2

  - id: board
    label: "Kanban Board"
    section: core
    type: kanban
    path: tickets.json
    review: true
    order: 5

  # Actions — items with review or completion requirement
  - id: initial_review
    label: "Initial Console Review"
    section: core
    type: markdown
    path: pages/initial-review.md
    review: true

  - id: choose_next_slice
    label: "Choose Next Slice"
    section: actions
    type: questionnaire
    path: questionnaires/initial-direction.json

  - id: console_contract
    label: "QuarterDeck Contract"
    section: docs
    type: markdown
    path: README.md

  # Docs — explicit known items (shadow glob-discovered duplicates)
  - id: rendered_docs
    label: "Rendered Documentation"
    section: docs
    type: link
    href: ../docs/index.html

  - id: pypi_reservation
    label: "PyPI Name Reservation"
    section: docs
    type: document
    path_md:  ../notes/PYPI_NAME_RESERVATION.md
    path_pdf: ../notes/PYPI_NAME_RESERVATION.pdf

  - id: command_status
    label: "Acceptance Status"
    section: docs
    type: command_status
