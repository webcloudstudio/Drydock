<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commanders Chair - {{PROJECT_NAME}}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  padding: 2rem;
  min-height: 80vh;
}
.header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1.5rem;
  align-items: start;
  padding-bottom: 1rem;
  border-bottom: 1px solid #334155;
}
.target-line,
.chair-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f8fafc;
  line-height: 1.2;
}
.label { color: #94a3b8; }
.header-meta {
  list-style: none;
  margin: 0.75rem 0 0;
  padding: 0;
}
.header-meta li {
  color: #cbd5e1;
  font-size: 0.9rem;
  margin-top: 0.35rem;
  font-family: "SF Mono", "Cascadia Code", monospace;
}
.question-lead {
  margin: 2rem 0;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid #334155;
}
.question-lead h2 {
  color: #f8fafc;
  font-size: 1rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 0.75rem;
}
.question-status {
  color: #cbd5e1;
  font-size: 1rem;
  margin-bottom: 0.9rem;
}
.next-step {
  color: #f8fafc;
  font-size: 0.95rem;
  font-family: "SF Mono", "Cascadia Code", monospace;
}
.next-step strong {
  color: #94a3b8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.8rem;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(130px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat {
  display: block;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 0.5rem;
  padding: 1rem 1.25rem;
  color: inherit;
  text-decoration: none;
}
.stat[href]:hover {
  border-color: #64748b;
  background: #26354a;
}
.stat-value {
  color: #f8fafc;
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
}
.stat-label {
  color: #94a3b8;
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  margin-top: 0.45rem;
  text-transform: uppercase;
}
.story-list { display: grid; gap: 0.35rem; margin: 0; }
.story-feature {
  color: #94a3b8;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 0.75rem;
  margin-bottom: 0.2rem;
}
.story-row {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  color: #cbd5e1;
  line-height: 1.5;
}
.story-name { flex: 1; }
.badge {
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  padding: 0.1rem 0.45rem;
  border-radius: 0.25rem;
  white-space: nowrap;
  text-transform: uppercase;
}
.badge-pending  { background: #334155; color: #94a3b8; }
.badge-review   { background: #78350f; color: #fde68a; }
.badge-verified { background: #14532d; color: #86efac; }
.badge-failed   { background: #7f1d1d; color: #fca5a5; }
.details {
  display: grid;
  gap: 1.25rem;
}
.detail-section {
  border-top: 1px solid #334155;
  padding-top: 1rem;
}
.detail-section h2 {
  color: #f8fafc;
  font-size: 1.1rem;
  margin-bottom: 0.75rem;
}
.detail-section ul {
  margin: 0;
  padding-left: 1.25rem;
}
.detail-section li {
  color: #cbd5e1;
  line-height: 1.5;
  margin: 0.25rem 0;
}
.empty {
  color: #94a3b8;
  font-style: italic;
}
@media (max-width: 760px) {
  body { padding: 1.25rem; }
  .header { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
